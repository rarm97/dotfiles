# tmux configuration.
# Window-focused workflow (panes are rarely used).
# Rosé Pine Moon palette to match nvim and wezterm.
# Prefix: Ctrl-a (more ergonomic than default Ctrl-b).

##### Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

##### Core behaviour
# Set explicitly because a WezTerm launched from Finder starts the tmux server
# with only the launchd PATH — no /opt/homebrew — so nothing brew-installed is
# found by run-shell or by anything a pane spawns non-interactively.
#
# No $HOME/.local/bin here: set-environment performs NO expansion, so a literal
# "$HOME/..." would be stored as those nine characters. Nothing needs it anyway —
# every script below is invoked by absolute path, and .zshrc prepends it for
# interactive shells.
set-environment -g PATH "/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
set -g base-index 1                 # windows start at 1, not 0
setw -g pane-base-index 1
set -g renumber-windows on          # fill gaps when windows are closed
set -g mouse on
set -g history-limit 100000
setw -g mode-keys vi
set -sg escape-time 10              # near-instant Esc (important for nvim)
set -g focus-events on              # let nvim detect focus changes

##### Terminal / colours
set -g default-terminal "tmux-256color"
# RGB = true colour. usstyle = styled underlines (undercurl, and coloured
# underlines). Without usstyle tmux strips those sequences, so nvim's diagnostic
# undercurls arrive as plain underlines with no colour — terminfo for
# tmux-256color carries neither Smulx nor Setulc, so tmux will not infer it.
set -sa terminal-features ",*:RGB:usstyle"

##### Keybindings
# Navigation — vim-style: h/l for windows, j/k for sessions
bind h previous-window
bind l next-window
bind H swap-window -t -1\; select-window -t -1
bind L swap-window -t +1\; select-window -t +1
bind j switch-client -n
bind k switch-client -p
bind w choose-tree -Zw              # full session/window overview

# Windows
bind c new-window -c "#{pane_current_path}"
bind q confirm-before -p "Kill window #W? (y/n)" "if-shell '[ #{session_windows} -gt 1 ]' kill-window 'run-shell \"~/.local/bin/tmux-kill-session\"'"
bind r command-prompt -I "#W" "rename-window '%%'"

# Sessions — C creates, Q kills (spawns a new session first if it's the last
# one, so WezTerm doesn't close)
unbind C
bind C new-session
bind Q run-shell "~/.local/bin/tmux-kill-session"
bind R command-prompt -I "#S" "rename-session '%%'"
bind f display-popup -E "~/.local/bin/tmux-sessionizer"

# Utility
# Clears the screen and scrollback. Delegated to a script because it has to look
# at what the pane is running first: sending "clear" blindly types into whatever
# owns the pty, which mangles an open nvim buffer and then erases the evidence.
bind BSpace run-shell "~/.local/bin/tmux-clear-scrollback"

# Save / source
#
# The 'quiet' argument matters: without it save.sh runs a spinner that repaints
# the status line every 100ms and then prints its own "Tmux environment saved!",
# which buries anything the guard has to say. And the message is left to the
# guard rather than added here, because a hard-coded "Session saved" would be a
# lie whenever the guard vetoes the save. @resurrect-guard-announce tells the
# guard this save was triggered by hand, so it should report either way; it
# clears itself, so continuum's timed saves stay silent unless they are vetoed.
bind s set -g @resurrect-guard-announce on \; run-shell "~/.config/tmux/plugins/tmux-resurrect/scripts/save.sh quiet"
# Forced save — bypasses the degenerate-state guard for one save. Use when you
# really do want to record a stripped-down session. Both flags clear themselves.
bind M-s set -g @resurrect-guard-force on \; set -g @resurrect-guard-announce on \; run-shell "~/.config/tmux/plugins/tmux-resurrect/scripts/save.sh quiet"
bind S source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

##### Clipboard
set -g set-clipboard on             # OSC52 clipboard passthrough

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "\
  if command -v pbcopy >/dev/null 2>&1; then pbcopy; \
  elif command -v wl-copy >/dev/null 2>&1; then wl-copy; \
  elif command -v xclip >/dev/null 2>&1; then xclip -selection clipboard -in; \
  elif command -v xsel >/dev/null 2>&1; then xsel --clipboard --input; \
  else cat >/dev/null; fi"

##### Status bar (rose-pine-moon palette)
set -g status-style "bg=#232136,fg=#e0def4"
set -g status-left "#[fg=#c4a7e7,bold] #S "
set -g status-right "#[fg=#6e6a86] %H:%M "
set -g window-status-current-format "#[fg=#c4a7e7,bold] #I:#W "
set -g window-status-format "#[fg=#6e6a86] #I:#W "
set -g status-left-length 20
set -g status-position bottom
set -g pane-border-style "fg=#44415a"
set -g pane-active-border-style "fg=#c4a7e7"
set -g message-style "bg=#232136,fg=#e0def4"

##### TPM (Tmux Plugin Manager)
# Auto-clones TPM on first run; plugins install with prefix+I.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'

if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm'"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'    # restore visible pane content
set -g @continuum-restore 'on'                  # auto-restore on tmux start
set -g @continuum-save-interval '15'            # auto-save every 15 minutes

# WORTH KNOWING, because nothing about the settings above hints at it: continuum
# has no timer. It appends `#(continuum_save.sh)` to status-right and depends on
# tmux running that command each time it DRAWS the status line — which tmux only
# does for an attached client.
#
# So a server you have detached from and left running does not auto-save. Not
# late, not partially: not at all, for as long as nothing is attached. Verified
# on a private socket with status-interval 1 — nothing after 30 seconds
# detached, a save within 2 seconds of attaching. Asserted in
# tests/test-continuum.sh.
#
# Two consequences. status-right must stay ABOVE the `run` line at the bottom of
# this file, or it overwrites continuum's addition and auto-save stops for good
# (check.sh asserts the ordering). And the last save always reflects the last
# time you were attached, so `tmux-resurrect-saves list` showing nothing recent
# after a long detached stretch is the mechanism working as designed, not a
# fault to hunt.

# Don't let a throwaway session state overwrite a good save.
#
# Continuum saves on a timer, so if that timer fires while tmux is holding
# something trivial — the bare one-window "main" session WezTerm creates on
# startup, say — the trivial state gets written and `last` is repointed at it.
# Auto-restore then brings back the trivial state instead of the real one.
#
# The guard runs as resurrect's post-save-layout hook, which fires after the
# candidate save is written but before `last` is moved. It counts windows in
# the candidate and vetoes the save if the state looks throwaway. See the
# script's header comment for how the veto works and how to tune it.
set -g @resurrect-hook-post-save-layout '~/.local/bin/tmux-resurrect-guard'
# Second hook: resurrect rewrites the shared pane_contents.tar.gz after the
# layout decision, so a veto also has to put back the scrollback belonging to
# the save it protected. Only does anything when the save above was vetoed.
set -g @resurrect-hook-post-save-all '~/.local/bin/tmux-resurrect-guard --post-save-all'
set -g @resurrect-guard 'on'                    # master switch
set -g @resurrect-guard-min-windows '2'         # fewer windows than this is never saved
set -g @resurrect-guard-collapse-pct '50'       # hold a >50% drop once, accept it if it repeats
set -g @resurrect-guard-notify 'on'             # report vetoes on the status line

# Resurrect prunes saves older than this on every save (always keeping the
# newest 5). Kept in step with tmux-resurrect-saves' KEEP_DAILY_DAYS so the two
# retention mechanisms agree; run `tmux-resurrect-saves prune` to thin the rest.
set -g @resurrect-delete-backup-after '90'

# Initialise TPM (keep at very bottom)
run '~/.config/tmux/plugins/tpm/tpm'
