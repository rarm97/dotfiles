# No blank line between prompts. The `format` below controls what the prompt
# contains, not the blank line before it — that is add_newline, which defaults
# to true, so this comment described the opposite of what was happening.
add_newline = false
format = "$directory$git_branch$git_status$python$nodejs$rust$golang$cmd_duration$line_break$character"

# Directory: short, readable
[directory]
style = "cyan"
truncate_to_repo = false
truncation_length = 5

[directory.substitutions]
"~" = " "
"code" = "󰏖 "
"Documents" = "󰈙 "
"Downloads" = "󰉍 "
".config" = " "

# Git branch: clear, single icon
[git_branch]
symbol = " "
style = "purple"
format = " [$symbol$branch]($style)"

# Git status: minimal but informative
[git_status]
style = "yellow"
format = " [$all_status$ahead_behind]($style)"
conflicted = " "
modified = " "
staged = " "
untracked = " "
deleted = "✖ "
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
stashed = " "

