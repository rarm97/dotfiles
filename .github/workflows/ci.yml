name: checks

# The git hooks run check.sh on commit and the suites on push, but both are
# local: `--no-verify` skips them, and a fresh clone that never ran `make hooks`
# never had them. This makes the checks a property of the repository rather than
# of one laptop.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    # macOS because these dotfiles are macOS-only — bootstrap.sh says so and
    # exits on anything else. A Linux runner would need every assertion about
    # WezTerm, fonts and Homebrew paths weakened to pass, which would make the
    # checks weaker everywhere to serve a platform nobody runs this on.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # Only what the suites and the repo-level checks need. Deliberately NOT
      # the full bootstrap: installing WezTerm, fonts and language servers to
      # assert things about this laptop would be slow and would still prove
      # nothing about a CI runner.
      - name: Install dependencies
        run: brew install stow shellcheck shfmt neovim tmux

      - name: Lint
        run: |
          shellcheck -x -P tests check.sh tidy.sh bootstrap.sh checks/*.sh tests/*.sh .githooks/*
          shfmt -i 2 -ci -d check.sh tidy.sh bootstrap.sh checks/*.sh tests/*.sh

      # Repository-internal assertions only. checks/machine.sh needs WezTerm, a
      # font, a stow tree and a git identity, none of which a runner has; see
      # check.sh's header for why the two halves are kept apart.
      - name: Repository checks
        run: make check-repo

      # Without this the runner skips the suites that matter most: restore,
      # integration, nvim, and five of the bindings. They skip honestly — each
      # names the file it wanted — but a check that only ever runs on one laptop
      # is the thing CI exists to replace. Stowing and fetching the tmux plugins
      # is cheap and makes them real.
      - name: Install the dotfiles so the suites can exercise them
        run: |
          make stow
          PLUGINS="$HOME/.config/tmux/plugins"
          mkdir -p "$PLUGINS"
          git clone --depth 1 https://github.com/tmux-plugins/tpm "$PLUGINS/tpm"
          git clone --depth 1 https://github.com/tmux-plugins/tmux-resurrect "$PLUGINS/tmux-resurrect"
          git clone --depth 1 https://github.com/tmux-plugins/tmux-continuum "$PLUGINS/tmux-continuum"

      # First nvim run installs 31 plugins through lazy. Done as its own step so
      # a network failure here is distinguishable from a test failure.
      - name: Prime the Neovim plugins
        run: nvim --headless "+Lazy! sync" +qa || echo "lazy sync failed; the nvim suite will report what it could not do"

      - name: Test suites
        run: make test
